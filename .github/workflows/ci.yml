name: Java CI (mex-transfer-api)

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "feature/**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codi
          POSTGRES_PASSWORD: codi
          POSTGRES_DB: codi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codi
        SPRING_DATASOURCE_USERNAME: codi
        SPRING_DATASOURCE_PASSWORD: codi
      run: ./gradlew build test --no-daemon
