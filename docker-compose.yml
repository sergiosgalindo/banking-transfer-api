services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codi}
      POSTGRES_DB: ${POSTGRES_DB:-codi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codi} -d ${POSTGRES_DB:-codi}"]
      interval: 5s
      timeout: 5s
      retries: 12
